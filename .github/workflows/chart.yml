name: Helm chart

# The chart is versioned and released independently of the application: bump `version` in
# charts/atomic-usb/Chart.yaml and merge to main to publish it to
#   - the Helm repository on the gh-pages branch, served from
#     https://raw.githubusercontent.com/<owner>/<repo>/gh-pages (chart packages are release assets)
#   - oci://ghcr.io/<owner>/charts/atomic-usb
on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/chart.yml"
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/chart.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint --strict charts/atomic-usb
      - name: Render and validate manifests
        run: |
          helm template atomic-usb charts/atomic-usb --namespace atomic-usb --include-crds > rendered.yaml
          helm template atomic-usb charts/atomic-usb --namespace atomic-usb \
            --set psk.generate=false,rbac.aggregateToDefaultRoles=false,agent.hostPID=false \
            --set-json 'agent.ignore=["abcd:*","1234:5678"]' > rendered-alt.yaml
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          ./kubeconform -strict -summary rendered.yaml rendered-alt.yaml

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish to the Helm repository (gh-pages branch)
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
          mark_as_latest: false
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_RELEASE_NAME_TEMPLATE: "chart-{{ .Name }}-{{ .Version }}"
      - name: Publish to GHCR (OCI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="$(helm show chart charts/atomic-usb | awk '/^version:/ {print $2}')"
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          if helm show chart "oci://ghcr.io/${owner}/charts/atomic-usb" --version "$version" >/dev/null 2>&1; then
            echo "atomic-usb ${version} is already published"
            exit 0
          fi
          helm package charts/atomic-usb --destination oci-package
          helm push "oci-package/atomic-usb-${version}.tgz" "oci://ghcr.io/${owner}/charts"
