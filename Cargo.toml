[package]
name = "kubevirt-atomic-usb"
version = "0.1.0"
edition = "2024"
description = "Attach USB devices plugged into any Kubernetes node to KubeVirt VMs anywhere in the cluster, with hotplug"

[[bin]]
name = "atomic-usb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
hmac = "0.13"
jiff = { version = "0.2", features = ["serde"] }
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }
kube = { version = "4.2", default-features = false, features = ["client", "config", "derive", "runtime", "rustls-tls", "ring"] }
libc = "0.2"
rand = "0.9"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
